services:
  - type: web
    name: malita-payfast-webhook
    env: python
    # Deliberately NOT "free": free web services on Render sleep after 15
    # minutes of no traffic, with a 30-60s cold start on the next request.
    # This service exists solely to receive PayFast's payment webhooks — if
    # it's asleep the moment PayFast tries to notify you of a payment, a
    # learner could get charged without their account actually upgrading.
    # "starter" (~$7/month) keeps it always-on. If you'd rather start on
    # $0 and accept that risk while validating demand, change this to
    # "free" and see the note in README.md section 4.3.
    plan: free #starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webhook_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # set this manually to your Supabase/Postgres connection string
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PAYFAST_SANDBOX
        value: "false"

      
  - type: web
    name: malita-api
    env: python
    # Free web services on Render block outbound SMTP (ports 25/465/587),
    # which breaks the "Forgot your password?" email send from this
    # service - upgrading to "starter" (~$7/month) restores 465/587
    # (port 25 stays blocked on every plan, but nothing here uses it).
    # This also removes the free tier's 30-60s cold-start sleep, which
    # matters for a backend real learners hit directly from the mobile app.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        sync: false
      # This service builds the PayFast checkout form the learner's
      # browser actually posts to payfast.co.za, so it needs the SAME
      # merchant credentials and live/sandbox flag as the webhook
      # service below - otherwise it silently falls back to
      # backend/payfast.py's hardcoded sandbox test merchant_id/key,
      # which PayFast's live edge (CloudFront) rejects with a raw,
      # un-PayFast-branded 500 "Server Error" instead of a normal
      # checkout page. fromService (rather than a second sync:false
      # entry) means these can never drift out of sync with the
      # webhook service's values again.
      - key: PAYFAST_MERCHANT_ID
        fromService:
          type: web
          name: malita-payfast-webhook
          envVarKey: PAYFAST_MERCHANT_ID
      - key: PAYFAST_MERCHANT_KEY
        fromService:
          type: web
          name: malita-payfast-webhook
          envVarKey: PAYFAST_MERCHANT_KEY
      - key: PAYFAST_PASSPHRASE
        fromService:
          type: web
          name: malita-payfast-webhook
          envVarKey: PAYFAST_PASSPHRASE
      - key: PAYFAST_SANDBOX
        fromService:
          type: web
          name: malita-payfast-webhook
          envVarKey: PAYFAST_SANDBOX
